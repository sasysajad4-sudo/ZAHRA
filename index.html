<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>برای عزیزترینم</title>

<style>

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
}

body{

background-image:url("1782707100560.png");

background-repeat:no-repeat;
background-position:center center;

/* کل عکس نمایش داده شود */
background-size:contain;

background-color:black;

position:relative;

}


/* قسمت کلیک روی پیام صوتی */

#play-area{

position:absolute;

/* بالا تر و چپ تر */
top:51%;
left:46%;

transform:translate(-50%,-50%);

width:65%;
height:60px;

cursor:pointer;

}

</style>

</head>

<body>

<audio id="music">
<source src="Gin - Vinak.mp3" type="audio/mpeg">
</audio>

<div id="play-area"></div>

<script>

const music=document.getElementById("music");
const area=document.getElementById("play-area");

area.addEventListener("click",()=>{

if(music.paused){

music.play();

}else{

music.pause();

}

});

</script>

</body>
</html>
