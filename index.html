<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>برای عزیزترینم</title>

<style>

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
}

body{

background-image:url("1-anrzhy-hsthay-chyst (2).png");

background-repeat:no-repeat;
background-position:center center;

/* کل تصویر دیده شود */
background-size:contain;

background-color:black;

position:relative;
}


/* ناحیه کلیک روی قسمت پیام صوتی */

#play-area{

position:absolute;

/* محل قسمت پیام صوتی */
top:54%;
left:50%;

transform:translate(-50%,-50%);

width:65%;
height:65px;

/* برای تست موقت */
border:2px solid transparent;

cursor:pointer;

}

</style>

</head>

<body>

<audio id="music">

<source src="Gin - Vinak.mp3" type="audio/mpeg">

</audio>


<div id="play-area"></div>


<script>

const music=document.getElementById("music");
const playArea=document.getElementById("play-area");

playArea.addEventListener("click",()=>{

if(music.paused){

music.play();

}

else{

music.pause();

}

});

</script>

</body>

</html>
