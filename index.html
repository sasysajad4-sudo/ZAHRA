<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>برای عزیزترینم</title>

<style>

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
}

body{
background-image:url("1782707100560.png");
background-repeat:no-repeat;
background-position:center center;
background-size:contain;
background-color:black;
position:relative;
}


/* پلیر ویس */

#voicePlayer{

position:absolute;

top:47%;
left:41%;

transform:translate(-50%,-50%);

display:flex;
align-items:center;
gap:10px;

padding:10px 15px;

border-radius:30px;

background:rgba(255,255,255,.15);

backdrop-filter:blur(8px);

}

/* دکمه پلی */

#playBtn{

width:45px;
height:45px;

border:none;
border-radius:50%;

background:#ff4d6d;

color:white;

font-size:22px;

cursor:pointer;

}

/* موج صدا */

.wave{

display:flex;
align-items:center;
gap:3px;
height:25px;

}

.bar{

width:4px;
height:10px;

background:white;

border-radius:10px;

animation:wave 1s infinite alternate;

}

.bar:nth-child(2){height:18px;}
.bar:nth-child(3){height:12px;}
.bar:nth-child(4){height:22px;}
.bar:nth-child(5){height:15px;}
.bar:nth-child(6){height:20px;}

@keyframes wave{

from{
transform:scaleY(.5);
}

to{
transform:scaleY(1.5);
}

}

#time{

color:white;
font-size:14px;

min-width:45px;

}

</style>

</head>

<body>

<audio id="music">
<source src="birthday.m4a" type="audio/mp4">
</audio>

<div id="voicePlayer">

<button id="playBtn">▶</button>

<div class="wave">

<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>

</div>

<div id="time">0:00</div>

</div>

<script>

const music=document.getElementById("music");
const btn=document.getElementById("playBtn");
const time=document.getElementById("time");

btn.onclick=function(){

if(music.paused){

music.play();
btn.innerHTML="❚❚";

}else{

music.pause();
btn.innerHTML="▶";

}

}

music.addEventListener("timeupdate",()=>{

let minutes=Math.floor(music.currentTime/60);

let seconds=Math.floor(music.currentTime%60);

if(seconds<10){
seconds="0"+seconds;
}

time.innerHTML=minutes+":"+seconds;

});

</script>

</body>
</html>
