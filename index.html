<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>برای عزیزترینم</title>

<style>

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
}

body{

background:url("1782707100560.png");
background-position:center;
background-repeat:no-repeat;
background-size:contain;
background-color:black;

position:relative;

}


/* دکمه پلی */

#playBtn{

position:absolute;

top:42%;
left:11.8%;

transform:translate(-50%,-50%);

width:56px;
height:56px;

border-radius:50%;
border:none;

background:transparent;

color:white;
font-size:28px;

cursor:pointer;

z-index:50;

}


/* زمان فعلی */

#current{

position:absolute;

top:44.4%;
left:15.5%;

color:#ffd0d8;
font-size:12px;

z-index:50;

}


/* زمان کل */

#duration{

position:absolute;

top:44.4%;
left:54.5%;

color:#ffd0d8;
font-size:12px;

z-index:50;

}


/* موج صدا */

.wave{

position:absolute;

top:42%;
left:20%;

display:flex;
align-items:center;

gap:2px;

z-index:50;

}

.bar{

width:2px;

background:#ff516e;

border-radius:10px;

box-shadow:0 0 6px #ff516e;

animation:move .8s infinite alternate;

}

.bar:nth-child(1){height:8px}
.bar:nth-child(2){height:15px}
.bar:nth-child(3){height:10px}
.bar:nth-child(4){height:18px}
.bar:nth-child(5){height:8px}
.bar:nth-child(6){height:13px}
.bar:nth-child(7){height:10px}
.bar:nth-child(8){height:20px}
.bar:nth-child(9){height:8px}
.bar:nth-child(10){height:16px}
.bar:nth-child(11){height:12px}
.bar:nth-child(12){height:19px}
.bar:nth-child(13){height:9px}
.bar:nth-child(14){height:14px}
.bar:nth-child(15){height:10px}
.bar:nth-child(16){height:18px}
.bar:nth-child(17){height:8px}
.bar:nth-child(18){height:15px}
.bar:nth-child(19){height:10px}
.bar:nth-child(20){height:12px}
.bar:nth-child(21){height:8px}
.bar:nth-child(22){height:16px}
.bar:nth-child(23){height:11px}
.bar:nth-child(24){height:18px}
.bar:nth-child(25){height:10px}

@keyframes move{

from{

transform:scaleY(.6);

}

to{

transform:scaleY(1.5);

}

}


/* نوار پیشرفت */

#progress{

position:absolute;

top:45%;
left:22%;

width:31%;

height:4px;

appearance:none;

background:transparent;

z-index:50;

}

#progress::-webkit-slider-thumb{

appearance:none;

width:10px;
height:10px;

border-radius:50%;

background:#ff516e;

cursor:pointer;

}

</style>

</head>

<body>

<audio id="music">

<source src="birthday.m4a" type="audio/mp4">

</audio>


<button id="playBtn">▶</button>


<div class="wave">

<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>

</div>


<div id="current">00:00</div>

<div id="duration">00:00</div>


<input
type="range"
id="progress"
value="0"
min="0"
max="100">


<script>

const music=document.getElementById("music");
const playBtn=document.getElementById("playBtn");
const current=document.getElementById("current");
const duration=document.getElementById("duration");
const progress=document.getElementById("progress");

playBtn.onclick=()=>{

if(music.paused){

music.play();
playBtn.innerHTML="❚❚";

}else{

music.pause();
playBtn.innerHTML="▶";

}

}


music.addEventListener("loadedmetadata",()=>{

let m=Math.floor(music.duration/60);
let s=Math.floor(music.duration%60);

if(s<10)s="0"+s;

duration.innerHTML=m+":"+s;

});


music.addEventListener("timeupdate",()=>{

let m=Math.floor(music.currentTime/60);
let s=Math.floor(music.currentTime%60);

if(s<10)s="0"+s;

current.innerHTML=m+":"+s;

progress.value=
(music.currentTime/music.duration)*100;

});


progress.addEventListener("input",()=>{

music.currentTime=
(progress.value/100)*music.duration;

});

</script>

</body>
</html>
