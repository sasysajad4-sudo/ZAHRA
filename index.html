<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>برای عزیزترینم</title>

<style>

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
}

body{
background-image:url("1782707100560.png");
background-repeat:no-repeat;
background-position:center center;
background-size:contain;
background-color:black;
position:relative;
}

/* دکمه پلی */

#playBtn{

position:absolute;

top:47%;
left:41%;

transform:translate(-50%,-50%);

width:58px;
height:58px;

border-radius:50%;
border:none;

background:rgba(255,60,90,.9);

color:white;
font-size:26px;

cursor:pointer;

box-shadow:
0 0 10px rgba(255,50,80,.7),
0 0 25px rgba(255,50,80,.5);

transition:.3s;

}

#playBtn:hover{

transform:translate(-50%,-50%) scale(1.08);

}

</style>

</head>

<body>

<audio id="music">
<source src="birthday.m4a" type="audio/mp4">
</audio>

<button id="playBtn">▶</button>

<script>

const music=document.getElementById("music");
const btn=document.getElementById("playBtn");

btn.onclick=function(){

if(music.paused){

music.play();
btn.innerHTML="❚❚";

}else{

music.pause();
btn.innerHTML="▶";

}

}

</script>

</body>
</html>
