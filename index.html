<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>برای عزیزترینم</title>

<style>

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
}

body{
background-image:url("1782707100560.png");
background-repeat:no-repeat;
background-position:center center;
background-size:contain;
background-color:black;
position:relative;
}

/* باکس ویس */

#voicePlayer{

position:absolute;

/* بالاتر و چپ تر */
top:43%;
left:35%;

transform:translate(-50%,-50%);

display:flex;
align-items:center;
gap:8px;

padding:7px 10px;

border-radius:25px;

background:rgba(255,255,255,.12);

backdrop-filter:blur(10px);

}

/* دکمه پلی کوچکتر */

#playBtn{

width:36px;
height:36px;

border:none;
border-radius:50%;

background:#ff4d6d;

color:white;

font-size:16px;

cursor:pointer;

}

/* موج صوتی کوچکتر */

.wave{

display:flex;
align-items:flex-end;

height:20px;

gap:3px;

}

.bar{

width:4px;

background:white;

border-radius:10px;

animation:move .8s infinite alternate;

}

.bar:nth-child(1){height:7px;}
.bar:nth-child(2){height:16px; animation-delay:.2s;}
.bar:nth-child(3){height:10px; animation-delay:.4s;}
.bar:nth-child(4){height:18px; animation-delay:.1s;}
.bar:nth-child(5){height:12px; animation-delay:.3s;}
.bar:nth-child(6){height:15px; animation-delay:.5s;}

@keyframes move{

from{
transform:scaleY(.6);
}

to{
transform:scaleY(1.4);
}

}

#time{

color:white;
font-size:11px;
min-width:35px;

}

</style>

</head>

<body>

<audio id="music">
<source src="birthday.m4a" type="audio/mp4">
</audio>

<div id="voicePlayer">

<button id="playBtn">▶</button>

<div class="wave">
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
</div>

<div id="time">0:00</div>

</div>

<script>

const music=document.getElementById("music");
const btn=document.getElementById("playBtn");
const time=document.getElementById("time");

btn.onclick=function(){

if(music.paused){
music.play();
btn.innerHTML="❚❚";
}else{
music.pause();
btn.innerHTML="▶";
}

}

music.addEventListener("timeupdate",()=>{

let minutes=Math.floor(music.currentTime/60);
let seconds=Math.floor(music.currentTime%60);

if(seconds<10){
seconds="0"+seconds;
}

time.innerHTML=minutes+":"+seconds;

});

</script>

</body>
</html>
