<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>برای عزیزترینم</title>

<style>

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
}

body{

background:url("1782707100560.png");
background-position:center;
background-repeat:no-repeat;
background-size:contain;
background-color:black;

position:relative;

}

/* دکمه پلی دقیقا روی دکمه عکس */

#playBtn{

position:absolute;

top:42%;
left:11.8%;

transform:translate(-50%,-50%);

width:56px;
height:56px;

border-radius:50%;
border:none;

background:transparent;

color:white;

font-size:28px;

cursor:pointer;

z-index:5;

}

/* زمان چپ */

#current{

position:absolute;

top:44.2%;
left:15.7%;

color:white;

font-size:12px;

font-family:Arial;

}

/* زمان راست */

#duration{

position:absolute;

top:44.2%;
left:54.7%;

color:white;

font-size:12px;

font-family:Arial;

}

/* خط پیشرفت */

#progress{

position:absolute;

top:44.8%;
left:21%;

width:31%;

height:4px;

appearance:none;

background:transparent;

z-index:10;

}

#progress::-webkit-slider-thumb{

appearance:none;

width:10px;
height:10px;

border-radius:50%;

background:#ff6b88;

cursor:pointer;

}

</style>

</head>

<body>

<audio id="music">

<source src="birthday.m4a" type="audio/mp4">

</audio>

<button id="playBtn">▶</button>

<div id="current">00:00</div>

<div id="duration">00:00</div>

<input
type="range"
id="progress"
value="0"
min="0"
max="100">

<script>

const music=document.getElementById("music");
const playBtn=document.getElementById("playBtn");
const current=document.getElementById("current");
const duration=document.getElementById("duration");
const progress=document.getElementById("progress");


playBtn.onclick=()=>{

if(music.paused){

music.play();
playBtn.innerHTML="❚❚";

}else{

music.pause();
playBtn.innerHTML="▶";

}

}


music.addEventListener("loadedmetadata",()=>{

let m=Math.floor(music.duration/60);
let s=Math.floor(music.duration%60);

if(s<10)s="0"+s;

duration.innerHTML=m+":"+s;

});


music.addEventListener("timeupdate",()=>{

let m=Math.floor(music.currentTime/60);
let s=Math.floor(music.currentTime%60);

if(s<10)s="0"+s;

current.innerHTML=m+":"+s;

progress.value=
(music.currentTime/music.duration)*100;

});


progress.addEventListener("input",()=>{

music.currentTime=
(progress.value/100)*music.duration;

});

</script>

</body>

</html>
