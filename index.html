<body>

<audio id="music">
    <source src="Gin - Vinak.mp3" type="audio/mpeg">
</audio>

<!-- دکمه نامرئی روی قسمت پیام صوتی -->
<div id="play-area"></div>

<script>

const music = document.getElementById("music");
const area = document.getElementById("play-area");

area.onclick = ()=>{

if(music.paused){
    music.play();
}
else{
    music.pause();
}

}

</script>

</body>
